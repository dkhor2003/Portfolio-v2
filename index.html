<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve the theme before first paint, otherwise the light default in the
      // stylesheet flashes before React can mount and switch to dark.
      // Mirrors applyTheme/readStoredTheme in src/lib/theme.tsx.
      (function () {
        try {
          // Dark unless the visitor has chosen otherwise: the site is designed
          // dark-first, so the OS preference is deliberately not consulted.
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Dylan Khor — Software Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Anton&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
