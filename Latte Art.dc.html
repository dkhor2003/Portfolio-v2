<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#0a0a0f}
@keyframes fillCup{from{height:0%}to{height:72%}}
@keyframes steamRise{0%{transform:translateY(0) scaleX(1);opacity:.5}50%{transform:translateY(-16px) scaleX(1.3);opacity:.15}100%{transform:translateY(-30px) scaleX(1);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>

<div style="background:#0a0a0f;color:#f2f2f5;font-family:'Inter',sans-serif;min-height:100vh;position:relative;overflow-x:hidden">

<sc-if value="{{ showLoader }}" hint-placeholder-val="{{ true }}">
<div style="position:fixed;inset:0;z-index:200;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s ease;opacity:{{ overlayOpacity }}">
  <div style="position:relative;width:70px;height:86px">
    <div style="position:absolute;top:-26px;left:14px;width:9px;height:20px;border-radius:50%;background:#c2c2cc;animation:steamRise 2.2s ease-in-out infinite"></div>
    <div style="position:absolute;top:-26px;left:31px;width:9px;height:20px;border-radius:50%;background:#c2c2cc;animation:steamRise 2.2s ease-in-out infinite .4s"></div>
    <div style="position:absolute;top:-26px;left:48px;width:9px;height:20px;border-radius:50%;background:#c2c2cc;animation:steamRise 2.2s ease-in-out infinite .8s"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:70px;border:3px solid #e8ddc9;border-top:none;border-radius:0 0 20px 20px;overflow:hidden;background:#141018">
      <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(oklch(0.8 0.15 55),oklch(0.6 0.13 50));height:0%;animation:fillCup 1.6s ease-out forwards"></div>
    </div>
    <div style="position:absolute;right:-16px;top:16px;width:20px;height:26px;border:3px solid #e8ddc9;border-left:none;border-radius:0 12px 12px 0"></div>
  </div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#7a7a88;letter-spacing:.08em;text-transform:uppercase">Pulling a shot…</div>
</div>
</sc-if>

<nav style="position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(20px,5vw,56px);background:rgba(10,10,15,.7);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06)">
  <a href="Portfolio.dc.html" style="text-decoration:none;color:#c2c2cc;font-size:13px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px">← back to portfolio</a>
  <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px">latte<span style="color:oklch(0.78 0.16 55)">.art</span></div>
</nav>

<header style="padding:90px clamp(20px,6vw,80px) 50px;max-width:900px;margin:0 auto;text-align:center;animation:fadeUp .7s ease .1s both">
  <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.78 0.16 55);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px">Side project</div>
  <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(30px,5vw,52px);line-height:1.08">Milk, steamed to a point.</div>
  <div style="font-size:15px;color:#9a9aa8;margin-top:16px;max-width:520px;margin-left:auto;margin-right:auto">A running gallery of rosettas, tulips, and the occasional swan — poured between pull requests.</div>
</header>

<section style="padding:0 clamp(20px,6vw,80px) 110px;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;animation:fadeUp .7s ease .2s both">
  <div style="grid-column:span 2;aspect-ratio:16/9"><image-slot id="latte1" shape="rounded" radius="16" placeholder="Drop a latte art photo"></image-slot></div>
  <div style="aspect-ratio:1/1"><image-slot id="latte2" shape="rounded" radius="16" placeholder="Drop a latte art photo"></image-slot></div>
  <div style="aspect-ratio:1/1"><image-slot id="latte3" shape="rounded" radius="16" placeholder="Drop a latte art photo"></image-slot></div>
  <div style="aspect-ratio:1/1"><image-slot id="latte4" shape="rounded" radius="16" placeholder="Drop a latte art photo"></image-slot></div>
  <div style="aspect-ratio:1/1"><image-slot id="latte5" shape="rounded" radius="16" placeholder="Drop a latte art photo"></image-slot></div>
  <div style="grid-column:span 2;aspect-ratio:16/9"><image-slot id="latte6" shape="rounded" radius="16" placeholder="Drop a latte art photo"></image-slot></div>
  <div style="aspect-ratio:1/1"><image-slot id="latte7" shape="rounded" radius="16" placeholder="Drop a latte art photo"></image-slot></div>
</section>

<footer style="padding:32px clamp(20px,6vw,80px) 40px;display:flex;justify-content:space-between;align-items:center;color:#5a5a68;font-size:12px;border-top:1px solid rgba(255,255,255,.06);max-width:1200px;margin:0 auto">
  <span>© 2026 Alex Rivera</span>
  <a href="Portfolio.dc.html" style="color:#5a5a68;text-decoration:none;font-family:'JetBrains Mono',monospace">← portfolio</a>
</footer>

</div>

<div style="font-size: 16px; line-height: 1; font-family: Poppins; position: absolute; left: 4px; top: 4px">Dylan Khor</div></x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { showLoader: true, overlayOpacity: 1 };

  componentDidMount() {
    this.t1 = setTimeout(() => this.setState({ overlayOpacity: 0 }), 1500);
    this.t2 = setTimeout(() => this.setState({ showLoader: false }), 2000);
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }

  renderVals() {
    return { showLoader: this.state.showLoader, overlayOpacity: this.state.overlayOpacity };
  }
}

</script>
</body>
</html>
